apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-db
  template:
    metadata:
      labels:
        app: payments-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "payments-root"
        - name: MYSQL_DATABASE
          value: "payments"
        ports:
        - containerPort: 3306
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            # Realistic mistake: limit copied from a generic template.
            # MySQL 8 needs ~400Mi+ to initialize -> kernel OOM-kills it.
            memory: "128Mi"
            cpu: "500m"
