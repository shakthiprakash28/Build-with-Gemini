apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-investigate-ksa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: k8s-investigate-app@k8s-investigation-agent-511111.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-investigate-agent
  namespace: default
  labels:
    app: k8s-investigate-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-investigate-agent
  template:
    metadata:
      labels:
        app: k8s-investigate-agent
    spec:
      serviceAccountName: k8s-investigate-ksa
      containers:
        - name: agent
          image: us-east1-docker.pkg.dev/k8s-investigation-agent-511111/k8s-investigate-repo/k8s-investigate:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GOOGLE_GENAI_USE_ENTERPRISE
              value: "true"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: "k8s-investigation-agent-511111"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: OTEL_SERVICE_NAME
              value: "k8s-investigate"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-investigate-agent-lb
  namespace: default
  labels:
    app: k8s-investigate-agent
spec:
  type: LoadBalancer
  selector:
    app: k8s-investigate-agent
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
