[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-investigate"
version = "0.1.0"
description = "Kubernetes log investigation agent with automated root cause analysis, evidence citation, and remediation generation"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kubernetes SRE Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
k8s-investigate = "k8s_investigate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["k8s_investigate*"]
exclude = ["sample_logs*", "tests*"]
